  else if(d && Array.isArray(d.habits) && d.habits.length) people = [normPerson({ name: 'Me', habits: d.habits, meta: d.meta })];

  state.people = people;
  state.activeId = people.some(p => p.id === d.activeId) ? d.activeId : people[0].id;

}
const find = id => state.habits.find(h => h.id === id);
const live = () => state.habits.filter(h => !h.archived);

function normalize(h){
  const period = ['day','week','month'].includes(h.period) ? h.period : 'day';
  return {
    id: h.id || uid(), name: String(h.name || 'Habit').slice(0,60), emoji: h.emoji || '✨',
    color: COLOR_MAP[h.color] || h.color || COLORS[0], period,
    target: Math.max(1, Math.round(+h.target || 1)),

    unit: h.unit || '', step: period === 'day' ? Math.max(1, Math.round(+h.step || 1)) : 1,
    minutes: Math.max(0, Math.round(+h.minutes || 0)),

/* ---------- natural language parsing ---------- */
const DAYTOK = '(?:mon(?:day)?|tue(?:s(?:day)?)?|wed(?:nesday)?|thu(?:r(?:s(?:day)?)?)?|fri(?:day)?|sat(?:urday)?|sun(?:day)?)';
const SMALL_UNITS = 'glass(?:es)?|cups?|servings?|sets?|laps?|meals?';
const BIG_UNITS = 'pages?|words?|steps?|km|kilometers?|kilometres?|miles?|push-?ups?|reps?|ml|oz|liters?|litres?';
const UNIT_NAME = { glass:'glasses', glasses:'glasses', cup:'cups', cups:'cups', serving:'servings', servings:'servings', set:'sets', sets:'sets', lap:'laps', laps:'laps', meal:'meals', meals:'meals',
  page:'pages', pages:'pages', word:'words', words:'words', step:'steps', steps:'steps', km:'km', kilometer:'km', kilometers:'km', kilometre:'km', kilometres:'km', mile:'miles', miles:'miles',
  pushup:'push-ups', pushups:'push-ups', 'push-up':'push-ups', 'push-ups':'push-ups', rep:'reps', reps:'reps', ml:'ml', oz:'oz', liter:'liters', liters:'liters', litre:'liters', litres:'liters' };
const niceStep = n => { if(n <= 12) return 1; for(const s of [5,10,25,50,100,250,500,1000,2500,5000]) if(n / s <= 8) return s; return 10000; };
const RE_ONCE = /\b(once|twice|thrice)\s+(?:a|per|each|every)\s+(day|week|month)\b/i;
const RE_TIMES = /(\d+)\s*(?:x|times?)\s*(?:a|per|each|every|\/)\s*(day|week|month)/i;
const RE_DAYS = new RegExp('\\bevery\\s+((?:' + DAYTOK + '\\b(?:\\s*(?:,|&|and)\\s*|\\s+)?)+)', 'i');

function parse(text){
  const raw = text.trim();
  if(!raw) return null;
  const low = raw.toLowerCase();
  let name = raw, period = 'day', target = 1, days = null, unit = '', step = 1, minutes = 0, when = 'any', m;
  const strip = re => { name = name.replace(re, ' '); };

  if((m = low.match(/\b(?:in the|every|each|at)\s+(morning|afternoon|evening|night)\b/))){
    when = m[1] === 'night' ? 'evening' : m[1];
    strip(/\b(?:in the|every|each|at)\s+(morning|afternoon|evening|night)\b/i);
  } else if((m = low.match(/\b(morning|afternoon|evening)\b/))) when = m[1];

  if((m = low.match(RE_ONCE))){ target = {once:1,twice:2,thrice:3}[m[1]]; period = m[2]; strip(RE_ONCE); }
  else if((m = low.match(RE_TIMES))){ target = Math.max(1, +m[1]); period = m[2]; strip(RE_TIMES); }
  else if((m = low.match(RE_DAYS))){
    days = [...new Set([...m[1].matchAll(/(mon|tue|wed|thu|fri|sat|sun)/g)].map(x => DOW.findIndex(d => d.toLowerCase() === x[1])))];
    strip(RE_DAYS);
  }
  else if(/\bweekdays?\b/.test(low)){ days = [1,2,3,4,5]; strip(/\b(every\s+|on\s+)?weekdays?\b/i); }
  else if(/\bweekends?\b/.test(low)){ days = [0,6]; strip(/\b(every\s+|on\s+|at\s+)?(the\s+)?weekends?\b/i); }
  else if(/\b(weekly|every\s+week)\b/.test(low)){ period = 'week'; strip(/\b(weekly|every\s+week)\b/i); }
  else if(/\b(monthly|every\s+month)\b/.test(low)){ period = 'month'; strip(/\b(monthly|every\s+month)\b/i); }
  else if(/\b(daily|every\s*day|each\s+day)\b/.test(low)){ strip(/\b(daily|every\s*day|each\s+day)\b/i); }

  if(period === 'day' && target === 1){
    const q = low.match(new RegExp('(\\d[\\d,]*(?:\\.\\d+)?)\\s*(' + SMALL_UNITS + '|' + BIG_UNITS + ')\\b'));
    if(q){
      const n = parseFloat(q[1].replace(/,/g,''));
      if(n >= 2){ target = Math.round(n); unit = UNIT_NAME[q[2]] || q[2]; step = niceStep(target); }
    }
  }
  const tm = low.match(/(\d+(?:\.\d+)?)\s*(hours?|hrs?|minutes?|mins?)\b/);
  if(tm){
    const v = parseFloat(tm[1]);
    minutes = Math.round(/^h/.test(tm[2]) ? v * 60 : v);
    if(minutes < 1 || minutes > 180) minutes = 0;
  }

  for(let i = 0; i < 2; i++){
    name = name.replace(/\s+/g,' ').replace(/^[\s,.\-–:]+|[\s,.\-–:]+$/g,'').replace(/^(i want to|i will|i'd like to|to)\s+/i,'').replace(/\s+(a|per|each|every|on|for|at|in the|in)$/i,'');
  }
  name = name.trim() || raw;
  name = name[0].toUpperCase() + name.slice(1);
  const emoji = (EMOJI.find(([re]) => re.test(low)) || [0,'✨'])[1];
  return { name, emoji, period, target, days, unit, step, minutes, when };
}

function freqLabel(h){
  if(h.period === 'day'){
    if(!h.days) return 'Daily';
    const s = [...h.days].sort().join();
    if(s === '1,2,3,4,5') return 'Weekdays';
    if(s === '0,6') return 'Weekends';
    return [...h.days].sort((a,b) => ((a+6)%7) - ((b+6)%7)).map(d => DOW[d]).join(', ');
  }
  return h.target === 1 ? (h.period === 'week' ? 'Weekly' : 'Monthly') : `${h.target}× a ${h.period}`;
}

function addHabit(p){
  const h = normalize({ ...p, id: uid(), color: COLORS[state.habits.length % COLORS.length], created: key(today()) });
  state.habits.push(h);
  return h;
}

/* ---------- progress, skips and streaks ---------- */
function isScheduled(h, d){ return h.period === 'day' && (!h.days || h.days.includes(d.getDay())); }
function sumRange(h, a, b){ let n = 0; for(let d = new Date(a); d <= b; d = addDays(d,1)) n += h.logs[key(d)] || 0; return n; }
function range(h, d){
  if(h.period === 'day') return [d, d];
  if(h.period === 'week'){ const s = weekStart(d); return [s, addDays(s,6)]; }
  return [monthStart(d), monthEnd(d)];
}
function skippedOn(h, d){
  if(h.period === 'day') return !!h.skips[key(d)];
  const [a,b] = range(h,d);
  for(let x = new Date(a); x <= b; x = addDays(x,1)) if(h.skips[key(x)]) return true;
  return false;
}
function progress(h, d = today()){
  const [a,b] = range(h,d);
  const done = sumRange(h,a,b);
  return { done, target: h.target, pct: Math.min(100, Math.round(done / h.target * 100)), complete: done >= h.target };
}
function streaks(h){
  const t = today();
  const first = Object.keys(h.logs).sort()[0];
  const start = fromKey(first && first < h.created ? first : h.created);
  let run = 0, best = 0;
  if(h.period === 'day'){
    for(let d = new Date(start); d <= t; d = addDays(d,1)){
      if(!isScheduled(h,d)) continue;
      const k = key(d), c = h.logs[k] || 0;
      if(c >= h.target) run++;
      else if(h.skips[k] || +d === +t){ /* skipped or still pending today: neither extends nor breaks */ }
      else run = 0;
      if(run > best) best = run;
    }
    return { cur: run, best };
  }
  let s = h.period === 'week' ? weekStart(start) : monthStart(start);
  while(s <= t){
    const [a,b] = range(h,s), sum = sumRange(h,a,b), isCur = t >= a && t <= b;
    if(sum >= h.target) run++;
    else if(!isCur && !skippedOn(h,s)) run = 0;
    if(run > best) best = run;
    s = h.period === 'week' ? addDays(s,7) : new Date(s.getFullYear(), s.getMonth() + 1, 1);
  }
  return { cur: run, best };
}
const streak = h => streaks(h).cur;
function setLog(h, k, v){ if(v > 0) h.logs[k] = v; else delete h.logs[k]; }

function dueInfo(h){
  const t = today(), p = progress(h, t);
  if(skippedOn(h,t)) return null;
  if(h.period === 'day'){
    if(!isScheduled(h,t)) return null;
    return { done: p.complete, p, note: h.target > 1 ? `${p.done} of ${p.target}${h.unit ? ' ' + h.unit : ''}` : (h.minutes ? `${h.minutes} min` : 'Today') };
  }
  const left = p.target - p.done;
  return { done: p.complete, p, note: p.complete ? `Done for this ${h.period}` : `${left} more this ${h.period}` };
}
function forecast(h){
  const t = today(), p = progress(h,t);
  if(skippedOn(h,t)) return { t: 'Paused', cls: 'ok' };
  if(p.complete) return { t: 'Done', cls: 'ok' };
  const end = range(h,t)[1];
  const left = Math.round((end - t) / DAYMS) + 1, need = p.target - p.done;
  return need > left ? { t: `Behind: ${need} to go in ${left} day${left > 1 ? 's' : ''}`, cls: 'bad' }
                     : { t: `On track: ${need} to go, ${left} day${left > 1 ? 's' : ''} left`, cls: 'ok' };
}

/* ---------- insights maths ---------- */
function rate(h, n, endOff = 0){
  const t = today(), end = addDays(t, -endOff), start = addDays(end, -(n - 1)), cs = fromKey(h.created);
  const a = start < cs ? cs : start;
  if(a > end) return null;
  if(h.period === 'day'){
    let sc = 0, dn = 0;
    for(let d = new Date(a); d <= end; d = addDays(d,1)){
      const k = key(d), c = h.logs[k] || 0;
      if(!isScheduled(h,d) || h.skips[k]) continue;
      if(+d === +t && c < h.target) continue;
      sc++; if(c >= h.target) dn++;
    }
    return sc ? dn / sc : null;
  }
  const days = Math.round((end - a) / DAYMS) + 1;
  const exp = h.period === 'week' ? h.target * days / 7 : h.target * days / 30;
  return Math.min(1, sumRange(h, a, end) / exp);
}
function overall(n, endOff = 0){
  const rs = live().map(h => rate(h, n, endOff)).filter(x => x != null);
  return rs.length ? rs.reduce((a,b) => a + b, 0) / rs.length : null;
}
function perfectOn(d){
  const k = key(d); let n = 0;
  for(const h of live()){
    if(h.period !== 'day' || !isScheduled(h,d) || h.skips[k] || d < fromKey(h.created)) continue;
    n++; if((h.logs[k] || 0) < h.target) return false;
  }
  return n >= 2;
}
function dayScore(d){
  const k = key(d); let s = 0, dn = 0;
  for(const h of live()){
    const c = h.logs[k] || 0;
    if(d < fromKey(h.created) && !c) continue;
    if(h.period === 'day' && isScheduled(h,d) && !h.skips[k]){ s++; if(c >= h.target) dn++; }
    else if(c > 0){ s++; dn++; }
  }
  return s ? dn / s : null;
}
function weekdayRates(n = 90){
  const t = today(), s = Array(7).fill(0), dn = Array(7).fill(0);
  for(let i = 0; i < n; i++){
    const d = addDays(t,-i), k = key(d), w = d.getDay();
    for(const h of live()){
      if(h.period !== 'day' || !isScheduled(h,d) || h.skips[k] || d < fromKey(h.created)) continue;
      const c = h.logs[k] || 0;
      if(i === 0 && c < h.target) continue;
      s[w]++; if(c >= h.target) dn[w]++;
    }
  }
  return [1,2,3,4,5,6,0].map(w => ({ w, rate: s[w] ? dn[w] / s[w] : null }));
}

    best = Math.max(best, streaks(h).best);
  });
  let perfect = 0; const t = today();
  for(let i = 0; i < 365; i++) if(perfectOn(addDays(t,-i))) perfect++;
  return { total, notes, best, perfect, habits: live().length, timers: state.meta.timers || 0 };
}

/* ---------- sample data ---------- */
function sample(){
  let seed = 7;
  const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const t = today();
  ['Meditate 10 min every morning','Drink 8 glasses of water','Read 20 pages in the evening','Workout 3 times a week','Call family weekly'].forEach(s => {
    const h = addHabit(parse(s));
    h.created = key(addDays(t,-70));
    for(let i = 70; i >= 0; i--){
      const d = addDays(t,-i), r = rnd(), k = key(d);
      if(h.period === 'day'){
        if(!isScheduled(h,d)) continue;
        if(i === 0) setLog(h, k, Math.floor(h.target / 2));
        else if(i === 12 && h.minutes) h.skips[k] = true;
        else if(r < .78) setLog(h, k, h.target);
        else if(r < .88) setLog(h, k, Math.max(1, Math.floor(h.target / 2)));
      } else if(i > 0 && r < h.target / 7 * 1.05){
        setLog(h, k, 1);
        if(h.name === 'Workout' && rnd() < .3) h.notes[k] = pick(['Legs day, felt strong','Quick 30 min','New personal best','Tired but showed up']);
      }
    }
  });
  newBadges().forEach(b => state.meta.earned.push(b.id));
  persist();
}

  return `<div data-id="${h.id}" class="${cx('relative h-[168px] overflow-hidden rounded-[28px] bg-[color:color-mix(in_srgb,var(--c)_13%,#131826)] ring-1 ring-white/[.05] transition-transform duration-300 ease-expo has-[.tap:active]:scale-[.965]', off && 'opacity-50')}"
      style="--c:${h.color};--p:${start}%;--d:${boot ? idx * 70 : 0}ms;box-shadow:0 14px 30px -18px ${h.color}">
    <button class="tap absolute inset-0 block w-full overflow-hidden rounded-[inherit] text-left" data-act="tap" data-id="${h.id}" aria-label="${esc(h.name)}: ${p.done} of ${p.target}. Tap to log.">
      <span class="${layer} text-ink">${tileInner(h, p, s, label, false)}</span>
      <span aria-hidden="true" class="absolute inset-x-0 bottom-0 h-[var(--p)] overflow-hidden bg-[color:var(--c)] transition-[height] duration-700 ease-expo [transition-delay:var(--d)] before:absolute before:inset-x-0 before:top-0 before:z-10 before:h-px before:bg-white/40">
        <span class="${layer} text-bg">${tileInner(h, p, s, label, true)}</span>

function renderDash(){
  const list = live();

}

/* shared list row used by Tasks and Planner */
function row(h, o){
  const { done, note, pct = 0, tag = 'button', attrs = '', extra = '', more = '', muted = false } = o;
  const ring = done
    ? `<span class="grid h-7 w-7 flex-none place-items-center rounded-full bg-[color:var(--c)] text-[15px] font-bold text-bg">✓</span>`
    : `<span class="relative h-7 w-7 flex-none rounded-full bg-[conic-gradient(var(--c)_var(--p),rgba(255,255,255,.12)_0)] after:absolute after:inset-[2.5px] after:rounded-full after:bg-surface"></span>`;
  const main = `<${tag} ${attrs} class="${cx(ROW, 'min-w-0 flex-1', tag === 'button' && 'active:scale-[.985]', (done || muted) && 'opacity-55')}" style="--c:${h.color};--p:${pct}%">
    ${ring}<span class="min-w-0 flex-1"><b class="${cx('block text-[15.5px] font-semibold', done && 'line-through decoration-white/30')}">${esc(h.name)}</b><span class="text-[13px] font-medium text-muted">${note}</span>${extra}</span>
    <span class="text-xl">${h.emoji}</span></${tag}>`;
  return more ? `<div class="flex items-stretch gap-2">${main}<button data-act="open" data-id="${h.id}" data-k="${more}" aria-label="Details for ${esc(h.name)}" class="grid w-11 flex-none place-items-center rounded-[18px] bg-surface text-muted ring-1 ring-white/[.06] transition duration-200 hover:text-ink">⋯</button></div>` : main;
}

function renderTasks(){
  const list = live();
  if(!list.length) return emptyState();
  const due = list.map(h => ({ h, i: dueInfo(h) })).filter(x => x.i);
  if(!due.length) return `<div class="px-4 py-14 text-center text-[15px] text-muted">Nothing is scheduled today.</div>`;
  const mk = x => row(x.h, { done: x.i.done, note: x.i.note, pct: x.i.p.pct, attrs: `data-act="tap" data-id="${x.h.id}"`, more: key(today()) });
  const todo = due.filter(x => !x.i.done), done = due.filter(x => x.i.done);
  const byWhen = arr => groupByWhen(arr.map(x => ({ ...x.h, _x: x }))).map(([title, hs]) =>
    `${title ? `<div class="${H2} first:mt-0">${title}</div>` : ''}<div class="flex flex-col gap-2.5">${hs.map(h => mk(h._x)).join('')}</div>`).join('');
  return `${todo.length ? byWhen(todo) : `<div class="px-4 py-10 text-center text-[15px] text-muted">All done for today.</div>`}
    ${done.length ? `<div class="${H2}">Completed</div><div class="flex flex-col gap-2.5">${done.map(mk).join('')}</div>` : ''}`;
}

function dotsFor(d){
  const k = key(d);
  return live().filter(h => isScheduled(h,d) || (h.period !== 'day' && (h.logs[k] || 0) > 0))
    .slice(0,6).map(h => {
      const c = h.logs[k] || 0, on = h.period === 'day' ? c >= h.target : c > 0;
      return `<i class="${cx('box-border h-1.5 w-1.5 rounded-full border-[1.5px] border-[color:var(--c)]', on && 'bg-[color:var(--c)]', h.skips[k] && !on && 'opacity-30')}" style="--c:${h.color}"></i>`;
    }).join('');
}

function renderPlanner(){
  const list = live();
  if(!list.length) return emptyState();
  const first = state.month, lead = (first.getDay() + 6) % 7, n = monthEnd(first).getDate(), tk = key(today());
  let cells = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d => `<div class="py-1.5 text-center text-xs font-medium text-muted">${d}</div>`).join('');
  cells += '<div></div>'.repeat(lead);
  for(let day = 1; day <= n; day++){
    const d = new Date(first.getFullYear(), first.getMonth(), day), k = key(d);
    const cls = cx('flex aspect-[1/1.05] min-w-0 flex-col items-center gap-[5px] rounded-[14px] px-0.5 py-1.5 text-sm font-medium transition duration-200',
      k === state.sel ? 'bg-ink text-bg' : 'hover:bg-white/[.07]', k === tk && k !== state.sel && 'font-bold text-accent');
    cells += `<button class="${cls}" data-act="day" data-k="${k}" aria-label="${d.toDateString()}">${day}<span class="flex max-w-[34px] flex-wrap justify-center gap-[3px]">${dotsFor(d)}</span></button>`;
  }
  const sel = fromKey(state.sel), future = sel > today();
  const items = list.filter(h => isScheduled(h, sel) || h.period !== 'day');
  const rows = items.map(h => {
    const c = h.logs[state.sel] || 0, done = h.period === 'day' ? c >= h.target : c > 0, p = progress(h, sel), sk = skippedOn(h, sel);
    let note = h.period === 'day' ? (h.target > 1 ? `${fmtN(c)} of ${fmtN(h.target)}${h.unit ? ' ' + h.unit : ''}` : freqLabel(h)) : `${freqLabel(h)}, ${p.done} of ${p.target} that ${h.period}`;
    if(sk) note = h.period === 'day' ? 'Skipped' : `Paused, ${note}`;
    const nt = h.notes[state.sel];
    return row(h, { done: future ? false : done, note, muted: sk && !done, pct: h.period === 'day' && !future ? Math.min(100, c / h.target * 100) : 0,
      tag: future ? 'div' : 'button', attrs: future ? '' : `data-act="toggleDay" data-id="${h.id}" data-k="${state.sel}"`,
      more: future ? '' : state.sel, extra: nt ? `<span class="mt-1 block truncate text-[13px] italic text-ink/70">“${esc(nt)}”</span>` : '' });
  }).join('');
  const flex = list.filter(h => h.period !== 'day').map(h => {
    const f = forecast(h);
    const pill = f.cls === 'ok' ? 'bg-emerald-400/15 text-emerald-300' : 'bg-rose-400/15 text-rose-300';
    return `<div class="${ROW}"><span class="text-xl">${h.emoji}</span><span class="min-w-0 flex-1"><b class="block text-[15.5px] font-semibold">${esc(h.name)}</b><span class="text-[13px] font-medium text-muted">${freqLabel(h)}, this ${h.period}</span></span><span class="rounded-full px-[11px] py-[5px] text-right text-xs font-semibold ${pill}">${f.t}</span></div>`;
  }).join('');
  const nav = 'rounded-xl bg-white/[.07] px-3.5 py-2 text-sm font-semibold transition duration-200 hover:bg-white/[.13]';
  return `<div class="${CARD}">
      <div class="mb-3.5 flex items-center justify-between">
        <h2 class="font-serif text-[26px] font-medium tracking-[-0.02em]">${first.toLocaleDateString('en-US',{month:'long',year:'numeric'})}</h2>
        <div class="flex gap-1.5"><button class="${nav}" data-act="prev" aria-label="Previous month">‹</button><button class="${nav}" data-act="now">Today</button><button class="${nav}" data-act="next" aria-label="Next month">›</button></div>
      </div>
      <div class="grid grid-cols-7 gap-1">${cells}</div></div>
    <div class="${H2}">${sel.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})}${future ? ' (planned)' : ''}</div>
    <div class="flex flex-col gap-2.5">${rows || '<div class="px-4 py-10 text-center text-[15px] text-muted">No habits scheduled this day.</div>'}</div>
    ${flex ? `<div class="${H2}">Forecast for flexible habits</div><div class="flex flex-col gap-2.5">${flex}</div>` : ''}`;
}

/* ---------- insights ---------- */
function renderInsights(){
  const list = live();
  if(!list.length) return emptyState();
  const t = today(), dn = ((t.getDay() + 6) % 7) + 1;           // days elapsed this week, Monday = 1
  const cur = overall(dn), prevW = overall(7, dn);
  const delta = cur != null && prevW != null ? Math.round((cur - prevW) * 100) : null;
  let checkins = 0, perfects = 0;
  for(let i = 0; i < dn; i++){
    const d = addDays(t, -i), k = key(d);
    list.forEach(h => { if((h.logs[k] || 0) > 0) checkins++; });
    if(perfectOn(d)) perfects++;
  }
  const ranked = list.map(h => ({ h, r: rate(h, dn) })).filter(x => x.r != null).sort((a,b) => b.r - a.r);
  const star = ranked[0];
  const wk = weekdayRates(90), bestW = Math.max(0, ...wk.map(x => x.rate || 0));

  const recap = `<div class="${CARD}">
    <div class="text-[13px] font-semibold text-muted">This week</div>
    <div class="mt-2 flex flex-wrap items-end gap-x-3 gap-y-1"><span class="font-serif text-[56px] font-medium leading-none tracking-[-0.03em]">${pctText(cur)}</span>
      ${delta != null ? `<span class="pb-2 text-sm font-semibold ${delta >= 0 ? 'text-emerald-300' : 'text-rose-300'}">${delta >= 0 ? '+' : ''}${delta} pts vs last week</span>` : ''}</div>
    <p class="mt-3 text-[15px] leading-relaxed text-muted">${checkins} check-in${checkins === 1 ? '' : 's'} so far, ${perfects} perfect day${perfects === 1 ? '' : 's'}.${star ? ` Strongest: ${star.h.emoji} ${esc(star.h.name)}.` : ''}</p></div>`;

  const bars = `<div class="${CARD}"><div class="mb-4 text-[13px] font-semibold text-muted">Best days of the week, last 90 days</div>
    <div class="flex h-28 items-end gap-2">${wk.map(x => {
      const hgt = x.rate == null ? 4 : Math.max(6, Math.round(x.rate * 100)), top = x.rate != null && x.rate === bestW && bestW > 0;
      return `<div class="flex h-full flex-1 flex-col items-center justify-end gap-2"><span class="text-[11px] font-semibold text-muted">${x.rate == null ? '' : Math.round(x.rate * 100)}</span>
        <div class="${cx('w-full rounded-t-lg', top ? 'bg-accent' : 'bg-white/15')}" style="height:${hgt}%"></div></div>`; }).join('')}</div>
    <div class="mt-2 flex gap-2">${wk.map(x => `<span class="flex-1 text-center text-[11px] font-medium text-muted">${DOW[x.w]}</span>`).join('')}</div></div>`;

  const per = `<div class="${CARD}"><div class="mb-4 text-[13px] font-semibold text-muted">Habits, last 30 days</div><div class="flex flex-col gap-4">${list.map(h => {
    const r = rate(h, 30), s = streaks(h);
    return `<div style="--c:${h.color}"><div class="mb-2 flex items-center gap-2.5"><span class="text-lg">${h.emoji}</span>
      <span class="min-w-0 flex-1 truncate text-[15px] font-semibold">${esc(h.name)}</span><span class="text-sm font-semibold">${pctText(r)}</span></div>
      <div class="h-1.5 overflow-hidden rounded-full bg-white/10"><div class="h-full rounded-full bg-[color:var(--c)] transition-[width] duration-700 ease-expo" style="width:${r == null ? 0 : Math.round(r * 100)}%"></div></div>
      <div class="mt-1.5 text-xs font-medium text-muted">Streak ${s.cur}, best ${s.best}</div></div>`; }).join('')}</div></div>`;

  const ws = weekStart(t); let cols = '';
  for(let w = 25; w >= 0; w--){
    let col = '';
    for(let d = 0; d < 7; d++){
      const dt = addDays(ws, -7 * w + d);
      if(dt > t){ col += '<i class="block aspect-square rounded-[4px]"></i>'; continue; }
      const sc = dayScore(dt);
      col += `<i title="${key(dt)}" class="block aspect-square rounded-[4px] bg-white/[.06]" style="${sc != null && sc > 0 ? `background:color-mix(in srgb,#8B9BFF ${Math.round(25 + 75 * sc)}%,#1B2132)` : ''}"></i>`;
    }
    cols += `<div class="flex flex-1 flex-col gap-[3px]">${col}</div>`;
  }
  const heatCard = `<div class="${CARD}"><div class="mb-4 text-[13px] font-semibold text-muted">Consistency, last 26 weeks</div><div class="flex gap-[3px]">${cols}</div>
    <p class="mt-3 text-xs font-medium text-muted">Brighter squares mean a larger share of that day's habits were done.</p></div>`;

  const earned = state.meta.earned;
  const badges = `<div class="${CARD}"><div class="mb-4 flex items-baseline justify-between"><span class="text-[13px] font-semibold text-muted">Badges</span><span class="text-xs font-semibold text-muted">${earned.length} of ${BADGES.length}</span></div>
    <div class="grid grid-cols-2 gap-2.5 min-[520px]:grid-cols-3">${BADGES.map(b => { const on = earned.includes(b.id);
      return `<div class="${cx('rounded-2xl p-3.5 text-center', on ? 'bg-white/[.06]' : 'bg-white/[.03] opacity-45')}"><div class="${cx('text-[30px] leading-none', !on && 'grayscale')}">${b.icon}</div>
        <div class="mt-2 text-[13.5px] font-semibold">${b.name}</div><div class="mt-0.5 text-[11.5px] leading-snug text-muted">${b.desc}</div></div>`; }).join('')}</div></div>`;

  return `<div class="flex flex-col gap-3.5">${recap}${bars}${per}${heatCard}${badges}</div>`;
}

/* ---------- celebrations: confetti, toast, tile cheer ---------- */
const CHEERS = ['Nice work!', 'That is the way.', 'Another one done.', 'Consistency is winning.', 'Small steps, real progress.', 'You showed up.', 'Keep the momentum.'];
const MILESTONES = [3, 7, 14, 21, 30, 50, 75, 100, 150, 200, 365];
const PALETTE = ['#6C7BFF','#2DD4A3','#FF8A4C','#FF6FA5','#4DB2FF','#A78BFA','#22C7D6','#F5B942'];
const reduceMotion = () => !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
const fx = { c: $('fx'), ctx: null, parts: [], raf: 0 };
function fxSize(){
  const d = window.devicePixelRatio || 1;
  fx.c.width = innerWidth * d; fx.c.height = innerHeight * d;
  fx.ctx = fx.c.getContext ? fx.c.getContext('2d') : null;
  if(fx.ctx) fx.ctx.setTransform(d, 0, 0, d, 0, 0);
}
window.addEventListener('resize', fxSize); fxSize();

function burst(x, y, o = {}){
  if(reduceMotion() || !fx.ctx) return;
  const { n = 40, colors = PALETTE, angle = -Math.PI / 2, spread = Math.PI * 2, power = 9, gravity = .25 } = o;
  for(let i = 0; i < n; i++){
    const a = angle + (Math.random() - .5) * spread, v = power * (.45 + Math.random() * .75);
    fx.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: gravity, w: 5 + Math.random() * 5, h: 3 + Math.random() * 4,
      rot: Math.random() * 6.28, vr: (Math.random() - .5) * .35, life: 0, max: 70 + Math.random() * 50, color: pick(colors), dot: Math.random() < .3 });
  }
  if(!fx.raf) fx.raf = requestAnimationFrame(fxLoop);
}
function fxLoop(){
  const ctx = fx.ctx;
  ctx.clearRect(0, 0, innerWidth, innerHeight);
  fx.parts = fx.parts.filter(p => p.life < p.max);
  for(const p of fx.parts){
    p.vx *= .985; p.vy = p.vy * .99 + p.g; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life++;
    ctx.save();
    ctx.globalAlpha = Math.max(0, Math.min(1, (p.max - p.life) / (p.max * .35)));
    ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.color;
    if(p.dot){ ctx.beginPath(); ctx.arc(0, 0, p.h * .7, 0, 6.283); ctx.fill(); } else ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
    ctx.restore();
  }
  if(fx.parts.length) fx.raf = requestAnimationFrame(fxLoop);
  else { ctx.clearRect(0, 0, innerWidth, innerHeight); fx.raf = 0; }
}
const buzz = p => { try { if(!reduceMotion() && navigator.vibrate) navigator.vibrate(p); } catch(e){} };
const sparkle = (o, c) => { buzz(8); burst(o.x, o.y, { n: 14, colors: [c, '#ffffff'], power: 4.5, gravity: .18 }); };
function cannons(){
  buzz([20, 50, 20, 50, 40]);
  const w = innerWidth, h = innerHeight;
  burst(0, h, { n: 90, angle: -Math.PI / 3, spread: .8, power: 17 });
  burst(w, h, { n: 90, angle: -2 * Math.PI / 3, spread: .8, power: 17 });
  setTimeout(() => burst(w / 2, h * .85, { n: 70, angle: -Math.PI / 2, spread: 1.1, power: 16 }), 260);
}
function fireworks(c){
  buzz([15, 40, 15, 40, 30]);
  [[.25,.3],[.75,.28],[.5,.2]].forEach(([px,py], i) => setTimeout(() => burst(innerWidth * px, innerHeight * py, { n: 55, power: 7, gravity: .12, colors: [c, '#F5B942', '#ffffff'] }), i * 220));
}
let actx = null;
function unlockAudio(){
  try { const A = window.AudioContext || window.webkitAudioContext; if(!A) return; actx = actx || new A(); if(actx.state === 'suspended') actx.resume(); } catch(e){}
}
function chime(){
  try {
    unlockAudio(); const ctx = actx; if(!ctx) return;
    [880, 1320, 1760].forEach((f, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain(), t = ctx.currentTime + i * .18;
      o.frequency.value = f; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.18, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + .5);
      o.start(t); o.stop(t + .55);
    });
  } catch(e){}
}

/* toast with optional Undo */
let toastSeq = 0, lastToast = 0, toastUndo = null;
function toast({ emoji, title, sub, color, undo }){
  const root = $('toast'), id = ++toastSeq;
  lastToast = Date.now(); toastUndo = undo || null;
  root.innerHTML = `<div style="--c:${color}" class="pointer-events-auto animate-toastIn flex max-w-sm items-center gap-3 rounded-2xl bg-raised py-3 pl-3 pr-4 shadow-[0_20px_50px_-15px_rgba(0,0,0,.9)] ring-1 ring-white/10">
      <span class="relative grid h-11 w-11 flex-none place-items-center rounded-full bg-[color:color-mix(in_srgb,var(--c)_25%,#1B2132)] text-[22px]">
        <span class="absolute inset-0 animate-ping rounded-full bg-[color:var(--c)] opacity-30"></span><span class="relative">${emoji}</span>
      </span>
      <span class="min-w-0 flex-1"><b class="block text-[15px] font-semibold">${esc(title)}</b><span class="block text-[13px] leading-snug text-muted">${esc(sub)}</span></span>
      ${undo ? '<button data-act="undo" class="ml-1 flex-none rounded-xl bg-white/10 px-3 py-2 text-[13px] font-semibold transition duration-200 hover:bg-white/20">Undo</button>' : ''}</div>`;
  setTimeout(() => {
    if(id !== toastSeq) return;
    const el = root.firstElementChild; if(!el) return;
    el.classList.remove('animate-toastIn'); el.classList.add('animate-toastOut');
    setTimeout(() => { if(id === toastSeq){ root.innerHTML = ''; toastUndo = null; } }, 280);
  }, undo ? 5200 : 3400);
}
const note = (title, sub = '', emoji = '✓', color = '#8B9BFF') => toast({ emoji, title, sub, color });

function cheerEl(id){
  const el = document.querySelector(`#main [data-id="${id}"]`); if(!el) return;
  el.classList.remove('animate-cheer'); void el.offsetWidth; el.classList.add('animate-cheer');
  setTimeout(() => el.classList.remove('animate-cheer'), 850);
}
function allDone(){ const due = live().map(h => dueInfo(h)).filter(Boolean); return due.length > 0 && due.every(i => i.done); }

function checkBadges(silent){
  const nb = newBadges(); if(!nb.length) return;
  nb.forEach(b => state.meta.earned.push(b.id)); persist();
  if(silent) return;
  const wait = Date.now() - lastToast < 3300 ? 2500 : 250;
  setTimeout(() => {
    toast({ emoji: nb[0].icon, title: `Badge unlocked: ${nb[0].name}`, sub: nb[0].desc + (nb.length > 1 ? ` (+${nb.length - 1} more)` : ''), color: '#F5B942' });
    fireworks('#F5B942');
    if(state.view === 'stats') render();
  }, wait);
}

function celebrate(h, o, wasComplete, wasAll, undo){
  const p = progress(h), c = h.color;
  cheerEl(h.id);
  if(!p.complete || wasComplete){ sparkle(o, c); return; }            // a step toward the goal
  const s = streak(h), unit = h.period === 'day' ? 'day' : h.period;
  if(!wasAll && allDone()){
    toast({ emoji: '🎉', title: 'Perfect day!', sub: 'Every habit is checked off for today.', color: c, undo });
    cannons();
  } else if(MILESTONES.includes(s)){
    toast({ emoji: '🏆', title: `${s}-${unit} streak!`, sub: `Achievement unlocked: ${h.emoji} ${h.name}`, color: c, undo });
    burst(o.x, o.y, { n: 60, colors: [c, '#F5B942', '#ffffff'] }); fireworks(c);
  } else {
    toast({ emoji: h.emoji, title: `${h.name} done`, sub: pick(CHEERS) + (s > 1 ? ` 🔥 ${s}-${unit} streak` : ''), color: c, undo });
    buzz([12, 40, 18]);
    burst(o.x, o.y, { n: 46, colors: [c, '#ffffff', '#F5B942'] });
  }
}

/* ---------- mutations (each one can be undone) ---------- */
const snap = () => { syncActive(); return JSON.stringify({ people: state.people, activeId: state.activeId }); };
const restore = s => () => {
  const d = JSON.parse(s); state.people = d.people; state.activeId = d.activeId; useActive();
  persist(); render(); if(state.sheet) renderSheet();

};
const centre = () => ({ x: innerWidth / 2, y: innerHeight / 2 });

function afterLog(h, o, added, was, wasAll, undo, isToday = true){
  persist(); render();
  if(added) isToday ? celebrate(h, o, was, wasAll, undo) : sparkle(o, h.color);
  checkBadges();
}
function bump(id, o = centre(), forceAdd = false){
  const h = find(id); if(!h) return;
  const k = key(today()), cur = h.logs[k] || 0, was = progress(h).complete, wasAll = allDone(), s = snap();
  let added = false;
  if(!was || forceAdd){
    const n = h.period === 'day' ? Math.min(h.step, Math.max(1, h.target - cur)) : 1;
    setLog(h, k, cur + n); added = true;
  } else if(cur > 0) setLog(h, k, 0);
  afterLog(h, o, added, was, wasAll, restore(s));
}
function minus(id){
  const h = find(id); if(!h) return;
  const k = key(today()), cur = h.logs[k] || 0;
  setLog(h, k, Math.max(0, cur - (h.period === 'day' ? h.step : 1)));
  persist(); render(); checkBadges(true);
}
function toggleDay(id, k, o = centre()){
  const h = find(id); if(!h) return;
  const cur = h.logs[k] || 0, was = progress(h, fromKey(k)).complete, wasAll = allDone(), s = snap();
  let added;
  if(h.period === 'day'){ added = cur < h.target; setLog(h, k, cur >= h.target ? 0 : Math.min(h.target, cur + h.step)); }
  else { added = !cur; setLog(h, k, cur ? 0 : 1); }
  afterLog(h, o, added, was, wasAll, restore(s), k === key(today()));
}
function logAmount(id, k, n, o = centre()){
  const h = find(id); if(!h || !(n > 0)) return;
  const cur = h.logs[k] || 0, was = progress(h, fromKey(k)).complete, wasAll = allDone(), s = snap();
  setLog(h, k, cur + Math.round(n));
  afterLog(h, o, true, was, wasAll, restore(s), k === key(today()));

}
function toggleSkip(id, k){
  const h = find(id); if(!h) return;
  const s = snap(), d = fromKey(k), had = skippedOn(h, d);
  if(had){ const [a,b] = range(h, d); for(let x = new Date(a); x <= b; x = addDays(x,1)) delete h.skips[key(x)]; }
  else h.skips[k] = true;
  persist(); render(); renderSheet(); checkBadges(true);
  toast({ emoji: had ? '▶️' : '⏸️', title: had ? 'Back on' : (h.period === 'day' ? 'Day skipped' : `Paused this ${h.period}`), sub: had ? `${h.name} counts again.` : 'Your streak stays safe.', color: h.color, undo: restore(s) });
}

/* ---------- focus timer ---------- */
let timer = null;
const TCIRC = 2 * Math.PI * 108;
const mmss = s => `${Math.floor(s / 60)}:${pad(s % 60)}`;
function startTimer(id){
  const h = find(id); if(!h || !h.minutes) return;
  closeSheet(true);
  timer = { id, total: h.minutes * 60, left: h.minutes * 60, end: Date.now() + h.minutes * 60000, paused: false };
  timer.iv = setInterval(tickTimer, 250);
  unlockAudio(); keepAwake();
  renderTimer();
}
function renderTimer(){
  const h = find(timer.id), root = $('timerRoot');
  root.innerHTML = `<div class="animate-fade fixed inset-0 z-[55] grid place-items-center bg-bg/95 backdrop-blur-md" style="--c:${h.color}">
    <div class="flex w-full max-w-sm flex-col items-center px-6 text-center">

          <circle id="tmRing" cx="120" cy="120" r="108" fill="none" stroke="${h.color}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${TCIRC}" stroke-dashoffset="0" style="transition:stroke-dashoffset .3s linear"/></svg>
        <span id="tmTime" class="font-serif text-[64px] font-medium tracking-[-0.03em]">${mmss(timer.left)}</span>
      </div>

        <button id="tmPause" data-act="tmPause" class="rounded-2xl bg-white/10 px-6 py-3 font-semibold transition duration-200 hover:bg-white/20">Pause</button>
        <button data-act="tmDone" class="rounded-2xl bg-ink px-6 py-3 font-semibold text-bg transition duration-200 active:scale-95">Finish now</button>
      </div>
      <button data-act="tmCancel" class="mt-5 text-sm font-semibold text-muted transition-colors hover:text-ink">Cancel</button>
    </div></div>`;
}
function tickTimer(){
  if(!timer || timer.paused) return;
  timer.left = Math.max(0, Math.ceil((timer.end - Date.now()) / 1000));
  const t = $('tmTime'), r = $('tmRing');
  if(t) t.textContent = mmss(timer.left);
  if(r) r.style.strokeDashoffset = String(TCIRC * (1 - timer.left / timer.total));
  if(timer.left <= 0) finishTimer();
}
function pauseTimer(){
  if(!timer) return;
  if(timer.paused){ timer.end = Date.now() + timer.left * 1000; timer.paused = false; } else timer.paused = true;
  const b = $('tmPause'); if(b) b.textContent = timer.paused ? 'Resume' : 'Pause';
}
let wakeLock = null;
function keepAwake(){ try { if(navigator.wakeLock) navigator.wakeLock.request('screen').then(l => { wakeLock = l; }).catch(() => {}); } catch(e){} }
function letSleep(){ try { if(wakeLock){ wakeLock.release(); wakeLock = null; } } catch(e){} }
document.addEventListener('visibilitychange', () => { if(!document.hidden && timer && !timer.paused) keepAwake(); });
function stopTimer(){ letSleep(); if(timer){ clearInterval(timer.iv); timer = null; } $('timerRoot').innerHTML = ''; }
function finishTimer(){
  if(!timer) return;
  const id = timer.id; stopTimer(); chime();
  state.meta.timers = (state.meta.timers || 0) + 1;
  bump(id, centre(), true);
}

async function copyText(t){

}

    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1500);

function readImport(text){
  let d; try { d = JSON.parse(text); } catch(e){ return { err: 'That does not look like a Tally backup.' }; }
  if(d && Array.isArray(d.people) && d.people.length){
    const people = d.people.map(normPerson);
    return { people, activeId: d.activeId, label: `${people.length} ${people.length === 1 ? 'person' : 'people'}`, scope: 'all people and habits' };
  }
  const arr = Array.isArray(d) ? d : d && d.habits;
  if(!Array.isArray(arr) || !arr.length) return { err: 'No habits found in that backup.' };
  const habits = arr.filter(x => x && x.name).map(normalize);
  if(!habits.length) return { err: 'No valid habits found in that backup.' };
  return { habits, meta: d && d.meta, label: `${habits.length} habit${habits.length === 1 ? '' : 's'}`, scope: `the habits of ${curP().name}` };
}

/* ---------- friends and online groups (shared storage) ---------- */
const GA = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const genCode = () => Array.from({ length: 6 }, () => GA[(Math.random() * GA.length) | 0]).join('');
const hasShared = () => signedIn() || !!(window.storage && window.storage.get && window.storage.set);
const grp = { members: [], cheers: [], err: '', at: 0, busy: false };
const gk = (code, part) => `g:${code}:${part}`;
async function sget(k){
  try {
    if(signedIn()) return (await api('/api/kv?key=' + encodeURIComponent(k))).value;
    const r = await window.storage.get(k, true); return r ? JSON.parse(r.value) : null;
  } catch(e){ return null; }
}
async function sset(k, v){
  try {
    if(signedIn()){ await api('/api/kv', { method: 'PUT', body: JSON.stringify({ key: k, value: v }) }); return true; }
    return !!(await window.storage.set(k, JSON.stringify(v), true));
  } catch(e){ return false; }
}
async function sdel(k){
  try {
    if(signedIn()) await api('/api/kv?key=' + encodeURIComponent(k), { method: 'DELETE' });
    else await window.storage.delete(k, true);
  } catch(e){}
}
async function slist(p){
  try {
    if(signedIn()) return (await api('/api/kv/list?prefix=' + encodeURIComponent(p))).keys || [];
    const r = await window.storage.list(p, true); return (r && r.keys) || [];
  } catch(e){ return []; }
}
const ago = t => {
  const s = Math.max(0, Math.round((Date.now() - t) / 1000));
  if(s < 60) return 'just now'; if(s < 3600) return Math.floor(s / 60) + ' min ago';
  if(s < 86400) return Math.floor(s / 3600) + ' h ago'; return Math.floor(s / 86400) + ' d ago';
};

/* what gets shared: names, streaks and percentages only. Never notes or individual logs. */
function memberRecord(){
  const p = curP(), list = live(), due = list.map(h => dueInfo(h)).filter(Boolean), t = today();
  const sts = list.map(h => ({ h, s: streaks(h) }));
  let checkins = 0;
  for(let i = 0; i < 7; i++){ const k = key(addDays(t, -i)); list.forEach(h => { if((h.logs[k] || 0) > 0) checkins++; }); }
  return { id: p.id, name: p.name, color: p.color, avatar: p.avatar || '', updated: Date.now(),
    today: { done: due.filter(x => x.done).length, total: due.length },
    week: overall(7), best: Math.max(0, ...sts.map(x => x.s.cur)), longest: Math.max(0, ...sts.map(x => x.s.best)), checkins,
    habits: sts.slice(0, 8).map(x => ({ e: x.h.emoji, n: x.h.name.slice(0, 28), s: x.s.cur })) };
}

let pubTimer = 0;
function schedulePublish(){
  const p = curP(); if(!p || !p.group || !hasShared()) return;
  clearTimeout(pubTimer); pubTimer = setTimeout(publishNow, 1500);
}
async function publishNow(){
  const p = curP(); if(!p || !p.group || !hasShared()) return;
  await sset(gk(p.group, 'm:' + p.id), memberRecord());
}
async function refreshGroup(){
  const p = curP(); if(!p || !p.group || !hasShared()) return;
  const code = p.group;
  const keys = await slist(gk(code, 'm:'));
  const recs = await Promise.all(keys.map(sget));
  const cheers = (await sget(gk(code, 'c:' + p.id))) || [];
  if(!curP() || curP().group !== code) return;                   // person switched meanwhile
  grp.members = recs.filter(Boolean); grp.cheers = cheers; grp.at = Date.now();
  const seen = state.meta.cheerSeen || 0, fresh = cheers.filter(c => c.t > seen);
  if(fresh.length){
    state.meta.cheerSeen = Math.max(...fresh.map(c => c.t)); persist();
    const last = fresh[fresh.length - 1];
    toast({ emoji: last.e || '👏', title: fresh.length > 1 ? `${fresh.length} new cheers` : `${last.from} cheered you`, sub: 'Keep it going!', color: '#F5B942' });
    cannons();
  }
  if(state.view === 'group') render();
}

async function createGroup(){
  const p = curP(); grp.err = ''; grp.busy = true; render();
  let code = '';
  for(let i = 0; i < 6 && !code; i++){ const c = genCode(); if(!(await slist(gk(c, ''))).length) code = c; }
  const ok = code && await sset(gk(code, 'meta'), { created: Date.now(), by: p.name });
  if(!ok){ grp.err = 'Could not reach online storage. Try again in a moment.'; grp.busy = false; render(); return; }
  p.group = code; persist(); await publishNow(); await refreshGroup(); grp.busy = false; render();
  toast({ emoji: '👥', title: 'Group created', sub: `Share code ${code} with your friends.`, color: p.color });
}
async function joinGroup(raw){
  const p = curP(), code = String(raw || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  grp.err = '';
  if(code.length !== 6){ grp.err = 'Group codes have 6 letters and numbers.'; render(); return; }
  grp.busy = true; render();
  const meta = await sget(gk(code, 'meta'));
  if(!meta){ grp.err = 'No group found with that code. Check it and try again.'; grp.busy = false; render(); return; }
  p.group = code; persist(); await publishNow(); await refreshGroup(); grp.busy = false; render();
  toast({ emoji: '🤝', title: 'Joined the group', sub: `You are now sharing progress as ${p.name}.`, color: p.color });
}
async function leaveGroup(){
  const p = curP(); if(!p.group) return;
  await sdel(gk(p.group, 'm:' + p.id));
  p.group = ''; grp.members = []; grp.cheers = []; state.confirm = ''; persist(); render();
  note('Left the group', 'Your progress is no longer shared.', '👋');
}
const lastCheer = {};
async function cheerMember(toId, toName){
  const p = curP(); if(!p.group) return;
  if(Date.now() - (lastCheer[toId] || 0) < 8000){ note('Easy there', 'One cheer at a time, give it a few seconds.', '😄'); return; }
  lastCheer[toId] = Date.now();
  const k = gk(p.group, 'c:' + toId), list = (await sget(k)) || [];
  list.push({ from: p.name, e: '👏', t: Date.now() });
  await sset(k, list.slice(-20));
  note('Cheer sent', `${toName} will see it next time they open the app.`, '👏', p.color);
}

/* ---------- accounts and cloud sync (installed-app build talking to the Tally server) ---------- */
const API = { base: (typeof window.TALLY_API === 'string' ? window.TALLY_API : '').replace(/\/+$/, ''), on: false, token: '', user: '', updatedAt: 0, dirty: false, last: 0, choice: null };
const AUTH_KEY = 'tally:auth';
try { const a = IS_PWA && JSON.parse(localStorage.getItem(AUTH_KEY) || 'null'); if(a && a.token){ API.token = a.token; API.user = a.user || ''; API.updatedAt = +a.updatedAt || 0; } } catch(e){}
const saveAuth = () => { try { if(API.token) localStorage.setItem(AUTH_KEY, JSON.stringify({ token: API.token, user: API.user, updatedAt: API.updatedAt })); else localStorage.removeItem(AUTH_KEY); } catch(e){} };
const signedIn = () => IS_PWA && API.on && !!API.token;
let syncHidden = false;
try { syncHidden = IS_PWA && localStorage.getItem('tally:noSync') === '1'; } catch(e){}

async function api(path, opts = {}){
  const r = await fetch(API.base + path, { ...opts, headers: { 'Content-Type': 'application/json', ...(API.token ? { Authorization: 'Bearer ' + API.token } : {}), ...(opts.headers || {}) } });
  let body = null; try { body = await r.json(); } catch(e){}
  if(r.status === 401 && API.token && !/\/auth\/(login|register)/.test(path)){ localSignOut(true); }
  if(!r.ok){ const err = new Error((body && body.error) || ('HTTP ' + r.status)); err.status = r.status; err.body = body; throw err; }
  return body;
}
async function probeApi(){
  if(!IS_PWA || typeof fetch !== 'function') return;
  try { const r = await fetch(API.base + '/api/health'); const j = r.ok ? await r.json() : null; API.on = !!(j && j.app === 'tally'); } catch(e){ API.on = false; }
  renderSync();
}

function renderSync(){
  const el = $('syncBar'); if(!el) return;
  if(!IS_PWA || !API.on || API.token || syncHidden){ el.innerHTML = ''; return; }
  el.innerHTML = `<div class="flex items-center gap-3 rounded-2xl bg-accent/10 py-2.5 pl-4 pr-2.5"><span class="text-xl">☁️</span>
    <div class="min-w-0 flex-1"><b class="block text-sm font-semibold">Back up and sync</b><span class="block text-[12.5px] leading-snug text-muted">Sign in to store everything online and use Friends.</span></div>
    <button data-act="acOpen" class="flex-none rounded-xl bg-ink px-3.5 py-2 text-[13px] font-semibold text-bg transition duration-200 active:scale-95">Sign in</button>
    <button data-act="syncHide" aria-label="Dismiss" class="grid h-8 w-8 flex-none place-items-center rounded-full text-lg text-muted transition duration-200 hover:bg-white/10">×</button></div>`;
}

/* ----- adopting data that came from the server ----- */
function adoptRemote(remote, quiet){
  const s = snap();
  if(!applyData(remote.data)) return false;
  API.updatedAt = remote.updatedAt; API.dirty = false; API.last = Date.now(); saveAuth(); saveLocal();
  Object.keys(prevPct).forEach(k => delete prevPct[k]); boot = true;
  render(); renderSheet(); renderSync();
  if(!quiet) toast({ emoji: '☁️', title: 'Synced', sub: 'Loaded your latest data from the cloud.', color: '#8B9BFF', undo: restore(s) });
  return true;
}
/* When two devices changed things at once, keep both sets of check-ins instead of dropping one. */
function mergeData(loc, rem){
  const byId = arr => new Map((arr || []).map(x => [x.id, x]));
  const lp = byId(loc.people), rp = byId(rem.people);
  const out = { v: 3, people: [], activeId: loc.activeId || rem.activeId };
  for(const id of new Set([...(rem.people || []).map(p => p.id), ...(loc.people || []).map(p => p.id)])){
    const a = lp.get(id), b = rp.get(id);
    if(!a || !b){ out.people.push(a || b); continue; }
    const hl = byId(a.habits), hr = byId(b.habits);
    const habits = [...new Set([...b.habits.map(h => h.id), ...a.habits.map(h => h.id)])].map(hid => {
      const x = hl.get(hid), y = hr.get(hid);
      if(!x || !y) return x || y;
      const logs = { ...(x.logs || {}) };
      for(const [k, v] of Object.entries(y.logs || {})) logs[k] = Math.max(logs[k] || 0, v);
      return { ...y, logs, notes: { ...(y.notes || {}), ...(x.notes || {}) }, skips: { ...(x.skips || {}), ...(y.skips || {}) } };
    });
    const ma = a.meta || {}, mb = b.meta || {};
    out.people.push({ ...b, group: a.group || b.group, habits,
      meta: { earned: [...new Set([...(ma.earned || []), ...(mb.earned || [])])], timers: Math.max(ma.timers || 0, mb.timers || 0), cheerSeen: Math.max(ma.cheerSeen || 0, mb.cheerSeen || 0) } });
  }
  return out;
}
let syncTimer = 0, pushing = false;
function scheduleSync(){
  if(!signedIn() || API.choice) return;
  API.dirty = true; clearTimeout(syncTimer); syncTimer = setTimeout(() => pushNow(), 1200);
}
async function pushNow(retried = false){
  if(!signedIn() || pushing) return;
  clearTimeout(syncTimer); pushing = true;
  let again = false;
  try {
    syncActive();
    const r = await api('/api/data', { method: 'PUT', body: JSON.stringify({ data: { v: 3, people: state.people, activeId: state.activeId }, baseUpdatedAt: API.updatedAt }) });
    API.updatedAt = r.updatedAt; API.dirty = false; API.last = Date.now(); saveAuth();
  } catch(e){
    if(e.status === 409 && e.body && e.body.data){
      syncActive();
      applyData(mergeData({ people: state.people, activeId: state.activeId }, e.body.data));
      API.updatedAt = e.body.updatedAt; API.dirty = true; saveLocal();
      Object.keys(prevPct).forEach(k => delete prevPct[k]);
      render(); if(state.sheet) renderSheet();
      toast({ emoji: '🔀', title: 'Merged with another device', sub: 'Check-ins from both devices were kept.', color: '#8B9BFF' });
      again = !retried;
    }
  }
  pushing = false;
  if(again) return pushNow(true);
  if($('sheetRoot').firstChild && state.sheet === 'settings') renderSheet();
}
async function pullNow(){
  if(!signedIn() || API.dirty || API.choice || pushing) return;
  try {
    const r = await api('/api/data');
    if(r.data && r.updatedAt > API.updatedAt) adoptRemote(r, false);
    else if(!r.data) { API.dirty = true; pushNow(); }
  } catch(e){}
}

/* ----- sign in / create account ----- */
async function authSubmit(mode){
  const u = $('acUser'), p = $('acPass'), err = $('acErr'); if(!u || !p) return;
  err.textContent = '';
  try {
    const r = await api('/api/auth/' + mode, { method: 'POST', body: JSON.stringify({ username: u.value.trim(), password: p.value }) });
    API.token = r.token; API.user = r.user.username; API.updatedAt = 0; saveAuth();
    await afterSignIn();
  } catch(e){ err.textContent = e.message || 'Something went wrong.'; }
}
async function afterSignIn(){
  let remote = null; try { remote = await api('/api/data'); } catch(e){}
  const hasRemote = !!(remote && remote.data && Array.isArray(remote.data.people));
  const localHas = state.people.some(p => p.habits.length);
  renderSync();
  if(hasRemote && localHas){ API.choice = remote; renderSheet(); return; }          // both sides have data: let the user pick
  if(hasRemote){ adoptRemote(remote, true); toast({ emoji: '☁️', title: `Welcome back, ${API.user}`, sub: 'Your habits were loaded from the cloud.', color: '#2DD4A3' }); }
  else { API.dirty = true; await pushNow(); toast({ emoji: '☁️', title: `Signed in as ${API.user}`, sub: 'Everything is now backed up online.', color: '#2DD4A3' }); }
  renderSheet(); if(state.view === 'group') render();
}
function chooseCloud(){ const r = API.choice; API.choice = null; adoptRemote(r, false); renderSheet(); }
async function chooseLocal(){ const r = API.choice; API.choice = null; API.updatedAt = r.updatedAt; saveAuth(); API.dirty = true; await pushNow(); toast({ emoji: '☁️', title: 'Cloud updated', sub: 'This device\'s data is now your cloud copy.', color: '#2DD4A3' }); renderSheet(); }
function localSignOut(expired){
  API.token = ''; API.user = ''; API.updatedAt = 0; API.choice = null; API.dirty = false; saveAuth();
  grp.members = []; grp.cheers = [];
  renderSync(); if(state.sheet === 'settings') renderSheet(); if(state.view === 'group') render();
  if(expired) toast({ emoji: '🔒', title: 'Signed out', sub: 'Your session ended. Sign in again to keep syncing.', color: '#8B9BFF' });
}
async function deleteAccount(){
  const pw = $('acDelPass'); const err = $('acErr');
  try { await api('/api/auth/me', { method: 'DELETE', body: JSON.stringify({ password: pw ? pw.value : '' }) }); }
  catch(e){ if(err) err.textContent = e.message; state.confirm = ''; return; }
  state.confirm = ''; localSignOut(false);
  toast({ emoji: '🗑️', title: 'Account deleted', sub: 'Your cloud data was removed. Data on this device was kept.', color: '#8B9BFF' });
}
function hideSync(){ syncHidden = true; try { localStorage.setItem('tally:noSync', '1'); } catch(e){} renderSync(); }

function accountHTML(){
  if(!IS_PWA || !API.on) return '';
  const card = 'mt-4 rounded-2xl bg-white/[.06] p-4';
  if(!API.token) return `<div class="${card}"><div class="flex items-center gap-3"><span class="text-2xl">☁️</span><div><b class="block text-[15px] font-semibold">Back up and sync</b><span class="text-[13px] leading-snug text-muted">Store everything online and use Friends on any device.</span></div></div>
    <input id="acUser" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="24" placeholder="Username" aria-label="Username" class="${FIELD} mt-3">
    <input id="acPass" type="password" autocomplete="current-password" placeholder="Password (8+ characters)" aria-label="Password" class="${FIELD} mt-2">
    <p id="acErr" class="mt-2 min-h-[18px] text-[13px] font-medium text-rose-300"></p>
    <div class="grid grid-cols-2 gap-2"><button data-act="acLogin" class="${ACT}">Sign in</button><button data-act="acRegister" class="rounded-2xl bg-ink px-3 py-3 text-[13.5px] font-semibold text-bg transition duration-200 active:scale-95">Create account</button></div></div>`;
  if(API.choice){
    const n = API.choice.data.people.reduce((a, p) => a + (p.habits || []).length, 0), m = state.people.reduce((a, p) => a + p.habits.length, 0);
    return `<div class="${card}"><b class="block text-[15px] font-semibold">Which copy should we keep?</b>
      <p class="mt-1 text-[13px] leading-snug text-muted">Your cloud account has ${n} habit${n === 1 ? '' : 's'} and this device has ${m}.</p>
      <div class="mt-3 grid grid-cols-2 gap-2"><button data-act="acUseCloud" class="rounded-2xl bg-ink px-3 py-3 text-[13.5px] font-semibold text-bg transition duration-200 active:scale-95">Use cloud copy</button><button data-act="acUseLocal" class="${ACT}">Use this device</button></div></div>`;
  }
  return `<div class="${card}"><div class="flex items-center gap-3"><span class="text-2xl">☁️</span><div class="min-w-0 flex-1"><b class="block truncate text-[15px] font-semibold">Signed in as ${esc(API.user)}</b>
      <span class="text-[13px] text-muted">${API.dirty ? 'Syncing...' : API.last ? 'Synced ' + ago(API.last) : 'Synced'}</span></div></div>
    <div class="mt-3 grid grid-cols-2 gap-2"><button data-act="acSync" class="${ACT}">Sync now</button><button data-act="acOut" class="${ACT}">Sign out</button></div>
    ${state.confirm === 'acdel' ? `<input id="acDelPass" type="password" autocomplete="current-password" placeholder="Enter your password to confirm" aria-label="Password" class="${FIELD} mt-3">` : ''}
    <p id="acErr" class="mt-2 min-h-[18px] text-[13px] font-medium text-rose-300"></p>
    <button data-act="acDel" class="${DANGER(state.confirm === 'acdel')} !py-3 text-[13.5px]">${state.confirm === 'acdel' ? 'Tap again to delete account and cloud data' : 'Delete account and cloud data'}</button></div>`;
}

/* ---------- render loop ---------- */
function render(){
  renderHead(); renderTabs();
  $('main').innerHTML = state.view === 'dash' ? renderDash() : state.view === 'tasks' ? renderTasks() : state.view === 'plan' ? renderPlanner() : state.view === 'stats' ? renderInsights() : renderGroup();
  // animate tile fills from their previous level to the new one
  requestAnimationFrame(() => requestAnimationFrame(() => {
    const tiles = document.querySelectorAll('#main [data-id][style*="--p"]');
    let n = 0;
    tiles.forEach(el => {
      const h = find(el.dataset.id); if(!h || !el.classList.contains('rounded-[28px]')) return;
      const pct = progress(h).pct;
      el.style.setProperty('--p', pct + '%'); prevPct[h.id] = pct; n++;
    });
    if(n) setTimeout(() => { boot = false; }, 900);
  }));
}

/* ---------- events ---------- */
const originOf = (e, el) => {
  if(e.clientX || e.clientY) return { x: e.clientX, y: e.clientY };
  const r = el.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if(!el) return;
  const a = el.dataset.act, id = el.dataset.id, o = originOf(e, el);
  const sk = state.sheetDate || key(today());
  switch(a){
    case 'tap': bump(id, o); break;
    case 'minus': minus(id); break;
    case 'open': openSheet(id, el.dataset.k); break;
    case 'close': closeSheet(); break;
    case 'back': state.sheetMode = 'detail'; state.confirm = ''; renderSheet(); break;
    case 'settings': state.sheet = 'settings'; state.confirm = ''; state.notice = ''; renderSheet(true); break;
    case 'tab': {
      state.view = el.dataset.v; render();
      const m = $('main'); m.classList.remove('animate-rise'); void m.offsetWidth; m.classList.add('animate-rise'); if(state.view === 'group') refreshGroup(); break;
    }
    case 'day': state.sel = el.dataset.k; render(); break;
    case 'toggleDay': toggleDay(id, el.dataset.k, o); break;
    case 'prev': state.month = new Date(state.month.getFullYear(), state.month.getMonth() - 1, 1); render(); break;
    case 'next': state.month = new Date(state.month.getFullYear(), state.month.getMonth() + 1, 1); render(); break;
    case 'now': state.month = monthStart(today()); state.sel = key(today()); render(); break;
    case 'sample': sample(); render(); break;
    case 'undo': { const f = toastUndo; toastUndo = null; $('toast').innerHTML = ''; if(f) f(); break; }
    /* habit sheet actions */
    case 'skip': toggleSkip(state.sheet, sk); break;
    case 'timer': startTimer(id); break;
    case 'amount': { const v = parseFloat($('amtIn').value); if(v > 0) logAmount(state.sheet, sk, v, o); break; }
    case 'edit': openEdit(); break;
    case 'pickEmoji': $('edEmoji').value = el.dataset.e; break;
    case 'pickColor': draft.color = el.dataset.c; paintEdit(); break;
    case 'dayChip': {
      const w = +el.dataset.w; draft.days = draft.days.includes(w) ? draft.days.filter(x => x !== w) : [...draft.days, w]; paintEdit(); break;
    }
    case 'save': saveEdit(); break;
    case 'moveUp': moveHabit(-1); break;
    case 'moveDown': moveHabit(1); break;
    case 'archive': {
      const h = find(state.sheet); if(!h) break; const s = snap();
      h.archived = true; persist(); closeSheet(true); render();
      toast({ emoji: '📦', title: 'Habit archived', sub: `${h.name} is hidden. Restore it from Backup and data.`, color: h.color, undo: restore(s) }); break;
    }
    case 'unarchive': {
      const h = find(id); if(!h) break; h.archived = false; persist(); render(); renderSheet(); break;
    }
    case 'del': {
      if(state.confirm !== 'del'){ state.confirm = 'del'; renderSheet(); break; }
      const h = find(id), s = snap(); if(!h) break;
      state.habits = state.habits.filter(x => x.id !== id); persist(); closeSheet(true); render();
      toast({ emoji: '🗑️', title: 'Habit deleted', sub: h.name, color: h.color, undo: restore(s) }); break;
    }
    /* people */
    case 'people': state.sheet = 'people'; state.sheetMode = 'detail'; state.confirm = ''; state.notice = ''; state.pEdit = ''; state.avNew = ''; state.avEdit = ''; renderSheet(true); break;
    case 'pSwitch': switchPerson(id); break;
    case 'pEdit': state.pEdit = id; state.avEdit = (state.people.find(p => p.id === id) || {}).avatar || ''; state.confirm = ''; renderSheet(); { const i = $('pName'); if(i){ i.focus(); i.select(); } } break;
    case 'pSave': savePerson(id); break;
    case 'pAvNew': state.avNew = state.avNew === el.dataset.e ? '' : el.dataset.e; paintAvatars(); break;
    case 'pAvEdit': state.avEdit = state.avEdit === el.dataset.e ? '' : el.dataset.e; paintAvatars(); break;
    case 'pAdd': addPerson(); break;
    case 'pDel': if(state.confirm !== 'pdel'){ state.confirm = 'pdel'; renderSheet(); } else deletePerson(id); break;
    /* friends group */
    case 'gCreate': createGroup(); break;
    case 'gJoin': joinGroup($('joinCode') ? $('joinCode').value : ''); break;
    case 'gCopy': copyText(curP().group).then(ok => note(ok ? 'Code copied' : 'Copy failed', ok ? 'Send it to your friends.' : 'Select the code and copy it by hand.', ok ? '📋' : '⚠️')); break;
    case 'gRefresh': refreshGroup().then(() => note('Refreshed', 'Leaderboard is up to date.', '🔄')); break;
    case 'gLeave': if(state.confirm !== 'gleave'){ state.confirm = 'gleave'; render(); } else leaveGroup(); break;
    case 'gCheer': cheerMember(id, el.dataset.n); break;
    case 'acOpen': state.sheet = 'settings'; state.sheetMode = 'detail'; state.confirm = ''; state.notice = ''; renderSheet(true); break;
    case 'acLogin': authSubmit('login'); break;
    case 'acRegister': authSubmit('register'); break;
    case 'acOut': localSignOut(false); note('Signed out', 'Your data stays on this device.', '👋'); break;
    case 'acSync': pushNow().then(() => pullNow()).then(() => { renderSheet(); note('Synced', 'You are up to date.', '☁️'); }); break;
    case 'acUseCloud': chooseCloud(); break;
    case 'acUseLocal': chooseLocal(); break;
    case 'acDel': if(state.confirm !== 'acdel'){ state.confirm = 'acdel'; renderSheet(); const i = $('acDelPass'); if(i) i.focus(); } else deleteAccount(); break;
    case 'syncHide': hideSync(); break;
    case 'install': doInstall(); break;
    case 'installHide': hideInstall(); break;
    /* backup and data */
    case 'exportDl': downloadBackup(); break;
    case 'exportCopy': copyBackup(); break;
    case 'pickFile': $('fileIn').click(); break;
    case 'importGo': state.confirm === 'import' ? runImport() : stageImport(); break;
    case 'eraseGo': {
      if(state.confirm !== 'erase'){ state.confirm = 'erase'; renderSheet(); break; }
      const s = snap();
      state.people.forEach(p => { if(p.group) sdel(gk(p.group, 'm:' + p.id)); });
      const fresh = normPerson({ name: 'Me' }); state.people = [fresh]; state.activeId = fresh.id; useActive();
      Object.keys(prevPct).forEach(k => delete prevPct[k]);
      persist(); closeSheet(true); render();
      toast({ emoji: '🧼', title: 'All data erased', sub: 'You can undo this for a few seconds.', color: '#8B9BFF', undo: restore(s) }); break;
    }
    /* timer */
    case 'tmPause': pauseTimer(); break;
    case 'tmDone': finishTimer(); break;
    case 'tmCancel': stopTimer(); break;
  }
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && !timer) closeSheet();
  if(e.key === 'Enter' && !e.isComposing){
    if(e.target.id === 'pNew'){ e.preventDefault(); addPerson(); }
    else if(e.target.id === 'pName'){ e.preventDefault(); savePerson(state.pEdit); }
    else if(e.target.id === 'joinCode'){ e.preventDefault(); joinGroup(e.target.value); }
    else if(e.target.id === 'acPass' || e.target.id === 'acUser'){ e.preventDefault(); authSubmit('login'); }
  }
});

/* text fields inside sheets save without re-rendering */
let noteTimer = 0;
document.addEventListener('input', e => {
  const t = e.target;
  if(t.id === 'noteIn'){
    const id = state.sheet, k = state.sheetDate || key(today()), v = t.value;
    clearTimeout(noteTimer); noteTimer = setTimeout(() => { saveNote(id, k, v); checkBadges(); }, 350);
  } else if(t.id === 'importIn'){ state.importText = t.value; if(state.confirm === 'import'){ state.confirm = ''; renderSheet(); const i = $('importIn'); if(i){ i.focus(); i.setSelectionRange(i.value.length, i.value.length); } } }
});
$('fileIn').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = () => { state.importText = String(rd.result || ''); stageImport(); };
  rd.onerror = () => { state.notice = 'Could not read that file.'; renderSheet(); };
  rd.readAsText(f); e.target.value = '';
});

/* ---------- add habit ---------- */
const input = $('addInput'), btn = $('addBtn'), prev = $('preview');
function updatePreview(){
  const p = parse(input.value);
  btn.classList.toggle('opacity-40', !p);
  if(!p){ prev.textContent = 'Try “Workout 3 times a week” or “Meditate 10 min every morning”'; return; }
  const bits = [freqLabel(p)];
  if(p.unit) bits.push(`${fmtN(p.target)} ${p.unit}`);
  if(p.minutes) bits.push(`${p.minutes} min timer`);
  if(p.when !== 'any') bits.push(WHEN[p.when].toLowerCase());
  prev.innerHTML = `${p.emoji} <b class="font-semibold text-ink">${esc(p.name)}</b>: ${esc(bits.join(', '))}`;
}
function submitHabit(){
  const p = parse(input.value);
  if(!p){ input.focus(); prev.textContent = 'Type a habit first, like “Workout 3 times a week”.'; return; }
  const h = addHabit(p);
  input.value = ''; updatePreview(); persist(); state.view = 'dash'; render();
  cheerEl(h.id);
  checkBadges();
  toast({ emoji: h.emoji, title: 'Habit added', sub: `${h.name}, ${freqLabel(h).toLowerCase()}. Tap its tile each time you do it.`, color: h.color });
  const t = document.querySelector(`#main [data-id="${h.id}"]`); if(t && t.scrollIntoView) t.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
input.addEventListener('input', updatePreview);
input.addEventListener('keydown', e => { if(e.key === 'Enter' && !e.isComposing){ e.preventDefault(); submitHabit(); } });
btn.addEventListener('click', submitHabit);
$('chips').innerHTML = TEMPLATES.map((t,i) => `<button type="button" data-i="${i}" class="flex-none rounded-full bg-white/[.06] px-[15px] py-2 text-[13.5px] font-medium text-ink/80 transition duration-200 hover:bg-white/[.12] hover:text-ink">${esc(t)}</button>`).join('');
$('chips').addEventListener('click', e => {
  const c = e.target.closest('button[data-i]'); if(!c) return;
  input.value = TEMPLATES[+c.dataset.i]; updatePreview(); input.focus();
});

/* ---------- start ---------- */
updatePreview();
render();
renderInstall();
probeApi().then(() => { if(signedIn()){ pullNow(); if(curP().group){ publishNow(); refreshGroup(); } } });
document.addEventListener('visibilitychange', () => { if(!document.hidden) pullNow(); });
store.load().then(d => {
  if(applyData(d)){
    newBadges().forEach(b => state.meta.earned.push(b.id));   // existing progress is credited silently
    render();
    if(curP().group){ publishNow(); refreshGroup(); }
  }
});
setInterval(() => { if(!document.hidden && curP() && curP().group) refreshGroup(); }, 45000);

</script>
